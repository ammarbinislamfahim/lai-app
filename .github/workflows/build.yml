name: Build & Release Desktop Packages (Windows, Linux, macOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Installer & Portable ZIP
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up pinned Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version-file: ".python-version"

      - name: Install locked runtime and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt -r requirements-build.txt

      - name: Run unit and accuracy test suite
        shell: pwsh
        run: |
          pytest --ignore=tests/test_packaged.py -v

      - name: Build one-folder executable with PyInstaller
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm leafarea.spec

      - name: Install Inno Setup (if not pre-installed) and build Windows Installer + Portable ZIP
        shell: pwsh
        run: |
          $ver = python -c "from app import config; print(config.SOFTWARE_VERSION)"
          Write-Host "Building packages for v$ver"

          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $defaultIscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $defaultIscc)) {
              choco install innosetup -y
            }
          }
          $isccCmd = if (Get-Command iscc -ErrorAction SilentlyContinue) { "iscc" } else { "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          & $isccCmd "/DMyAppVersion=$ver" installer.iss

          $portableZip = "dist\LeafAreaAnalyzer-v$ver-portable.zip"
          Compress-Archive -Path "dist\LeafAreaAnalyzer" -DestinationPath $portableZip -Force

          Get-ChildItem dist\*.exe, dist\*.zip | Select-Object Name, Length

      - name: Verify packaged Windows executable (test_packaged.py)
        shell: pwsh
        run: |
          pytest tests/test_packaged.py -v -s | Tee-Object -FilePath dist\packaged_test_windows.log

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: windows-artifacts
          path: |
            dist/LeafAreaAnalyzer-Setup-v*.exe
            dist/LeafAreaAnalyzer-v*-portable.zip
            dist/packaged_test_windows.log
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64 Archive (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install system OpenCV and desktop validation utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 binutils desktop-file-utils

      - name: Set up pinned Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version-file: ".python-version"

      - name: Install locked runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt -r requirements-build.txt

      - name: Run unit, launcher, installer, and accuracy test suite
        run: |
          pytest --ignore=tests/test_packaged.py -v

      - name: Build one-folder executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm leafarea.spec
          VER="$(python -c 'from app import config; print(config.SOFTWARE_VERSION)')"
          cp -f install_linux.sh dist/install_linux.sh
          cp -f uninstall_linux.sh dist/uninstall_linux.sh
          chmod +x dist/install_linux.sh dist/uninstall_linux.sh
          tar -C dist -czf "dist/LeafAreaAnalyzer-v${VER}-linux-x86_64.tar.gz" LeafAreaAnalyzer install_linux.sh uninstall_linux.sh
          ls -lh "dist/LeafAreaAnalyzer-v${VER}-linux-x86_64.tar.gz"

      - name: Verify packaged Linux executable (test_packaged.py)
        run: |
          env -i PATH=/usr/bin:/bin pytest tests/test_packaged.py -v -s | tee dist/packaged_test_linux.log

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: linux-artifacts
          path: |
            dist/LeafAreaAnalyzer-v*-linux-x86_64.tar.gz
            dist/packaged_test_linux.log
          if-no-files-found: error

  build-macos:
    name: Build macOS Archive (Optional)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up pinned Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version-file: ".python-version"

      - name: Install locked runtime and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt -r requirements-build.txt

      - name: Run unit and accuracy test suite
        run: |
          pytest --ignore=tests/test_packaged.py -v

      - name: Build one-folder executable with PyInstaller
        run: |
          pyinstaller --clean --noconfirm leafarea.spec
          VER="$(python -c 'from app import config; print(config.SOFTWARE_VERSION)')"
          (cd dist && zip -r "LeafAreaAnalyzer-v${VER}-macos.zip" LeafAreaAnalyzer)

      - name: Verify packaged macOS executable (test_packaged.py)
        run: |
          pytest tests/test_packaged.py -v -s | tee dist/packaged_test_macos.log

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4.4.3
        with:
          name: macos-artifacts
          path: |
            dist/LeafAreaAnalyzer-v*-macos.zip
            dist/packaged_test_macos.log
          if-no-files-found: warn

  release:
    name: Create GitHub Release & Combined SHA256SUMS.txt
    runs-on: ubuntu-22.04
    needs: [build-windows, build-linux, build-macos]
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.build-windows.result == 'success' && needs.build-linux.result == 'success'
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: release_Staging
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        run: |
          cd release_Staging
          shopt -s nullglob
          FILES=(*.exe *.zip *.tar.gz)
          sha256sum "${FILES[@]}" | tee SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2.0.9
        with:
          generate_release_notes: true
          files: |
            release_Staging/LeafAreaAnalyzer-Setup-v*.exe
            release_Staging/LeafAreaAnalyzer-v*-portable.zip
            release_Staging/LeafAreaAnalyzer-v*-linux-x86_64.tar.gz
            release_Staging/LeafAreaAnalyzer-v*-macos.zip
            release_Staging/SHA256SUMS.txt
            release_Staging/packaged_test_*.log
