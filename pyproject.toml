[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "leafarea-analyzer"
version = "1.5.6"
description = "Fully Automatic Leaf Area & LAI Measurement Desktop and Web Application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Leaf Area & LAI Analyzer Contributors" }
]
keywords = ["leaf-area", "lai", "leaf-area-index", "plant-science", "ecophysiology", "opencv", "fastapi"]
dependencies = [
  "fastapi>=0.92.0",
  "uvicorn>=0.17.6",
  "python-multipart>=0.0.5",
  "pydantic>=1.10.4",
  "opencv-python-headless>=4.8.0",
  "numpy>=1.24.0",
  "scikit-image>=0.21.0",
  "scipy>=1.10.0",
  "pandas>=2.0.0",
  "openpyxl>=3.1.0",
  "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.23.0",
  "pyinstaller>=6.0.0",
]

[project.scripts]
leafarea-analyzer = "launcher:main"
lai-analyzer = "launcher:main"

[tool.setuptools]
py-modules = ["launcher"]
packages = ["app", "app.pipeline"]
include-package-data = true

[tool.setuptools.package-data]
app = [
  "static/*",
  "static/samples/*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
